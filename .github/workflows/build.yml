name: Build RetrôPixel ROM

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de build'
        required: true
        default: 'userdebug'
        type: choice
        options:
          - userdebug
          - user
          - eng

jobs:
  build:
    runs-on: ubuntu-22.04
    # ATENÇÃO: Para builds completas use um self-hosted runner
    # Este workflow funciona para testes parciais no runner gratuito

    steps:
      - name: Checkout rom-builder
        uses: actions/checkout@v4

      - name: Liberar espaço em disco
        run: |
          echo "Espaço antes da limpeza:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          echo "Espaço após limpeza:"
          df -h

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git git-lfs gnupg gperf \
            imagemagick lib32readline-dev lib32z1-dev libelf-dev \
            lz4 libncurses-dev libsdl1.2-dev libssl-dev \
            libxml2-dev libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev \
            openjdk-11-jdk python3 python3-pip

      - name: Instalar repo tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configurar Git
        run: |
          git config --global user.email "victor@retropixel.rom"
          git config --global user.name "Victor-VieiraSA"

      - name: Inicializar repo (LineageOS 21)
        run: |
          mkdir -p lineage
          cd lineage
          repo init \
            -u https://github.com/LineageOS/android.git \
            -b lineage-21.0 \
            --depth=1 \
            --no-clone-bundle

      - name: Copiar local manifest
        run: |
          mkdir -p lineage/.repo/local_manifests
          cp local_manifest.xml lineage/.repo/local_manifests/

      - name: Sincronizar sources
        run: |
          cd lineage
          repo sync \
            -c \
            -j$(nproc) \
            --no-tags \
            --no-clone-bundle \
            --force-sync

      - name: Ativar ccache
        run: |
          echo "USE_CCACHE=1" >> lineage/build/envsetup.sh
          ccache -M 10G

      - name: Build ROM
        run: |
          cd lineage
          source build/envsetup.sh
          breakfast devon
          mka bacon

      - name: Upload da ROM gerada
        uses: actions/upload-artifact@v4
        with:
          name: retropixel-rom-${{ github.run_number }}
          path: lineage/out/target/product/devon/*.zip
          retention-days: 7
